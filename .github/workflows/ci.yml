name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same PR / branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit, integration, and property tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  validate:
    name: Schema & data validation (offline)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run legacy README marker check
        env:
          PYTHONPATH: scripts
        run: |
          # The legacy validator remains as a compatibility wrapper for the
          # existing marker contract. The new schema validator lives in
          # miccai_index.validation.
          python scripts/validate_readme.py

      - name: Validate canonical data (offline)
        env:
          PYTHONPATH: src
        run: |
          python -m miccai_index validate --offline --scope miccai-all-years --mode broad --tracks all || echo "::notice::No canonical data yet — first pipeline run will populate it."