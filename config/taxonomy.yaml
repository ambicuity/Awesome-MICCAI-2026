    label: "BraTS"
    patterns:
      - "\\bbrats\\b"
  - id: isic
    label: "ISIC"
    patterns:
      - "\\bisic\\b"
  - id: lidc
    label: "LIDC-IDRI"
    patterns:
      - "\\blidc\\b"
  - id: luna16
    label: "LUNA16"
    patterns:
      - "\\bluna\\b"
      - "\\bluna16\\b"
  - id: acdc
    label: "ACDC"
    patterns:
      - "\\bacdc\\b"
  - id: chaos
    label: "CHAOS"
    patterns:
      - "\\bchaos\\b"
  - id: msd
    label: "Medical Segmentation Decathlon"
    patterns:
      - "\\bmedical segmentation decathlon\\b"
      - "\\bmsd\\b"
  - id: kits
    label: "KiTS"
