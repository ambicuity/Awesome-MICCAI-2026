        weight: 3
  - id: sam
    label: "SAM-family"
    threshold: 2
    rules:
      - pattern: "\\bsam\\b"
        weight: 3
      - pattern: "\\bsegment anything\\b"
        weight: 4
      - pattern: "\\bmedsam\\b"
        weight: 4
  - id: vision_language_model
    label: "Vision-Language Model"
    threshold: 2
    rules:
      - pattern: "\\bvision[- ]language\\b"
        weight: 4
      - pattern: "\\bvlm\\b"
