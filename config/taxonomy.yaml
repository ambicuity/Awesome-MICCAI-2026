    threshold: 2
    rules:
      - pattern: "\\btransformer\\b"
        weight: 3
      - pattern: "\\bvit\\b"
        weight: 3
      - pattern: "\\bvision transformer\\b"
        weight: 4
      - pattern: "\\bswin\\b"
        weight: 3
  - id: cnn
    label: "CNN"
    threshold: 2
    rules:
      - pattern: "\\bconvolutional neural\\b"
        weight: 3
      - pattern: "\\bcnn\\b"
        weight: 2
      - pattern: "\\bresnet\\b"
        weight: 2
      - pattern: "\\bunet\\b"
        weight: 3
      - pattern: "\\b3d[- ]?cnn\\b"
        weight: 3
  - id: diffusion
    label: "Diffusion"
    threshold: 2
    rules:
      - pattern: "\\bdiffusion model\\b"
        weight: 4
      - pattern: "\\bdiffusion\\b"
        weight: 2
  - id: gan
    label: "GAN"
    threshold: 2
    rules:
      - pattern: "\\bgenerative adversarial\\b"
